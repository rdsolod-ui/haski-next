server {
    listen 80;
    listen [::]:80;
    server_name haski.parkskazka.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name haski.parkskazka.ru;

    root /var/www/haski-next/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/haski.parkskazka.ru.access.log;
    error_log  /var/log/nginx/haski.parkskazka.ru.error.log;

    ssl_certificate /etc/letsencrypt/live/haski.parkskazka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haski.parkskazka.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32M;

    include /etc/nginx/snippets/haski-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    # Original gallery photos remain on the same origin while responsive
    # first-view covers are owned by each immutable release.
    location /assets/ {
        root /var/www/haski.parkskazka.ru;
        expires 30d;
        include /etc/nginx/snippets/haski-security-headers.conf;
        access_log off;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/haski-security-headers.conf;
        access_log off;
    }

    location ~* ^/media/.*\.mp4$ {
        types { video/mp4 mp4; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/haski-security-headers.conf;
        access_log off;
    }

    location ~* ^/(?:media|img)/.*\.(?:avif|webp|png|jpe?g|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/haski-security-headers.conf;
        access_log off;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        expires 1h;
        include /etc/nginx/snippets/haski-security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.woff2$ {
        types { font/woff2 woff2; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/haski-security-headers.conf;
        access_log off;
    }

    # Clean public URLs: /dogs/adel resolves to /dogs/adel.html.
    # HTML is revalidated so a release switch is visible immediately.
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\.(?!well-known).* { deny all; }
}
