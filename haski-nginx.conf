server {
    listen 80;
    listen [::]:80;
    server_name haski.parkskazka.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name haski.parkskazka.ru;

    # НОВЫЙ статический сайт (Next.js export). Старый PHP остаётся в /var/www/haski.parkskazka.ru как бэкап/источник фото.
    root /var/www/haski-next/out;
    index index.html;

    access_log /var/log/nginx/haski.parkskazka.ru.access.log;
    error_log  /var/log/nginx/haski.parkskazka.ru.error.log;

    ssl_certificate /etc/letsencrypt/live/haski.parkskazka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haski.parkskazka.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32M;

    # Фото собак отдаём из старого сайта (не копируем гигабайты).
    location /assets/ {
        root /var/www/haski.parkskazka.ru;
        expires 30d;
        access_log off;
    }

    # Хешированные ассеты Next — вечный кэш.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Чистые URL: /dogs/adel -> /dogs/adel.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
