name: Build and verify static site

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: haski-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Protect legacy and QR-code URLs
        run: npm run test:routes

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium webkit

      - name: Run desktop and mobile acceptance tests
        run: npm run test:e2e

      - name: Enforce Lighthouse budgets
        run: npm run test:lighthouse

      - name: Create SHA-256 release manifest
        run: npm run artifact:manifest

      - name: Upload verified static artifact
        uses: actions/upload-artifact@v4
        with:
          name: haski-static-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: haski-browser-diagnostics-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haski-lighthouse-${{ github.sha }}
          path: reports/lighthouse/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haski-screenshots-${{ github.sha }}
          path: reports/screenshots/
          if-no-files-found: ignore
          retention-days: 14
